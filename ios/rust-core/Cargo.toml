[package]
name = "ctdozlite_ios_core"
version = "0.0.5"
edition = "2021"
authors = ["TIPC1110 <tienichpc1110@gmail.com>"]
description = "Native Rust protocol, crypto, scheduler, auto-reply, and thread store core for ctdozlite iOS/iPadOS/iPhone Duo (min iOS 12.0+)"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
name = "ctdozlite_ios_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
aes-gcm = "0.10"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false
